<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | EduNext Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: { brand: { primary: '#E11D48', dark: '#0F172A', surface: '#F1F5F9' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; letter-spacing: -0.01em; font-family: 'Inter', sans-serif; }
        .ai-gradient { background: linear-gradient(135deg, #4F46E5 0%, #E11D48 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        * { font-style: normal !important; }
        .nav-item.active { background-color: #E11D48; color: white; box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.2); }
    </style>
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher-responsive.css') }}">
    <script defer src="{{ url_for('static', filename='js/teacher-navigation.js') }}"></script>
</head>
<body class="teacher-shell flex h-screen overflow-hidden text-slate-900 bg-brand-surface">

    <!-- SIDEBAR -->
    {% include 'GV/_sidebar.html' %}

    <main class="flex-1 flex flex-col min-w-0 h-screen bg-brand-surface relative overflow-hidden">
        <header class="h-20 bg-white/70 backdrop-blur-xl border-b border-slate-200/60 px-10 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest italic">{% block header_breadcrumb %}{% endblock %}</h2>
            </div>
            <div class="flex items-center gap-4">
                {% block header_right %}{% endblock %}
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10 custom-scrollbar">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
