<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | EduNext Hệ Thống Lớp Học Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' 
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        input:focus + i { color: #2563eb !important; }
        .mesh-bg {
            background-color: #ffffff;
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.05) 0px, transparent 50%);
        }
    </style>
</head>
<body class="mesh-bg text-slate-800 font-sans min-h-screen flex items-center justify-center p-6 selection:bg-brand-500 selection:text-white">

    <div class="w-full max-w-lg bg-white rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-slate-100 p-10 md:p-14 relative overflow-hidden">
        
        <!-- TRANG TRÍ -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 to-indigo-700"></div>
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-50 rounded-full blur-3xl opacity-50"></div>

        <div class="text-center mb-10 relative z-10">
            <div class="w-20 h-20 bg-brand-50 text-brand-500 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-sm border border-brand-100 rotate-12 transition-transform hover:rotate-0">
                <i class="ph-fill ph-lock-laminated"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-3 tracking-tighter italic">Quên mật khẩu?</h1>
            <p class="text-slate-500 font-medium leading-relaxed">Đừng lo lắng! Hãy nhập email đăng ký, chúng tôi sẽ cấp lại mật khẩu mới cho bạn.</p>
        </div>

        <form onsubmit="handleForgotPassword(event)" class="space-y-6 relative z-10">
            <div class="group">
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Email đăng ký</label>
                <div class="relative">
                    <input type="email" id="email" required placeholder="nhap_email@truong.edu.vn" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 bg-slate-50/30 focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition-all duration-300 font-medium text-slate-700">
                    <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl transition-colors"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-blue-500/20 flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95 text-xs uppercase tracking-widest">
                Khôi phục mật khẩu <i class="ph-bold ph-paper-plane-right"></i>
            </button>
        </form>

        <div class="mt-10 text-center relative z-10">
            <a href="/login" class="inline-flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-brand-500 transition-all group">
                <i class="ph-bold ph-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                Quay lại đăng nhập
            </a>
        </div>
    </div>

    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const btnSubmit = document.querySelector('.btn-submit');
            const originalText = btnSubmit.innerHTML;

            btnSubmit.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin text-lg"></i> Đang xử lý...';
            btnSubmit.disabled = true;

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value })
                });

                const data = await response.json();
                if (data.success) {
                    alert("✅ Thành công! Mật khẩu mới đã được gửi về email của bạn.\nHãy kiểm tra hộp thư (cả mục Spam nhé).");
                    window.location.href = '/login';
                } else {
                    alert("❌ Lỗi: " + data.message);
                }
            } catch (error) {
                alert("⚠️ Không thể kết nối tới máy chủ!");
            } finally {
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
